set -g mode-keys vi
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
# set -g default-terminal "alacritty"
# set -ag terminal-overrides ",alacritty:RGB"
set -g mouse on

# Or use a wildcard instead of forcing a default mode.
# Some users in the comments of this gist have reported that this work better.
#set -sg terminal-overrides ",*:RGB"

# You can also use the env variable set from the terminal.
# Useful if you share your configuration betweeen systems with a varying value.
#set -ag terminal-overrides ",$TERM:RGB"

# Smart pane switching with smart-splits.nvim
# Replaced vim-tmux-navigator with smart-splits-nvim v3 backend
# The backend sets @pane-is-vim; the TPM plugin below reads it

# my stuff

# change prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# splitting windows
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

# panes
bind-key -r m resize-pane -Z

# vim motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# smart-splits.nvim tmux integration
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'wrap'
set -g @smart-splits_resize_step_size '2'

# list of tmux tmux-plugins
# prefix + C-s - save
# prefix + C-r - restore
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 15 minutes 
# set -g @continuum-restore 'on' # automatically restore sessions

# theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/double/cyan'


# initialize tmux plugin manager (needs to be at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
